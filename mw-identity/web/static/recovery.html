<!doctype html>
<html lang="{{.Lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="color-scheme" content="light dark" />
    <title>{{t .Lang "recovery.meta_title"}} · MW Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/portal.css" />
    <script src="/static/theme.js" defer></script>
  </head>
  <body class="identity-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="MattediWorks">
        <svg class="brand-symbol" aria-hidden="true">
          <use href="/static/brand.svg#mark" />
        </svg>
        <span>MATTEDI<span>WORKS</span></span>
      </a>
      <div class="topbar-actions">
        <a
          class="language-link"
          href="{{.LangSwitchURL}}"
          title="{{t .Lang "lang.switch_label"}}"
          >{{t .Lang "lang.switch_code"}}</a
        >
        <button
          class="theme-button"
          type="button"
          data-theme-toggle
          aria-label="{{t .Lang "common.theme"}}"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/static/icons.svg#moon" />
          </svg>
        </button>
      </div>
    </header>
    <main class="info-shell recovery-shell">
      <a class="back-link" href="/login"
        ><svg class="icon" aria-hidden="true">
          <use href="/static/icons.svg#arrow-left" /></svg
        >{{t .Lang "recovery.back"}}</a
      >
      <span class="round-icon"
        ><svg class="icon" aria-hidden="true">
          <use href="/static/icons.svg#rotate" /></svg
      ></span>
      <h1>{{t .Lang "recovery.title"}}</h1>
      <p class="info-lead">{{t .Lang "recovery.lead"}}</p>
      <div class="notice">
        <span
          ><svg class="icon" aria-hidden="true">
            <use href="/static/icons.svg#shield" /></svg
        ></span>
        <p>
          <strong>{{t .Lang "recovery.notice_title"}}</strong>{{t .Lang "recovery.notice_body"}}
        </p>
      </div>
      <button class="primary-button" id="recovery-start" type="button">
        {{t .Lang "recovery.start"}}<svg class="icon" aria-hidden="true">
          <use href="/static/icons.svg#arrow-right" />
        </svg>
      </button>
      <p
        class="inline-status"
        id="recovery-status"
        role="status"
        aria-live="polite"
      ></p>
      <footer class="page-footer">
        <a href="/privacy">{{t .Lang "common.privacy"}}</a><span>•</span
        ><a href="/security">{{t .Lang "common.security"}}</a><span>•</span
        ><span>{{t .Lang "common.copyright"}}</span>
      </footer>
    </main>
    <script src="/recovery.js" defer></script>
  </body>
</html>
