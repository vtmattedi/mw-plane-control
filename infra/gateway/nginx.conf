worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    log_format main
        '$remote_addr - $host [$time_local] '
        '"$request_method $uri $server_protocol" '
        '$status $body_bytes_sent '
        'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    map $http_x_forwarded_proto $mw_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_real_ip $mw_real_ip {
        default $http_x_real_ip;
        ""      $remote_addr;
    }

    upstream mw_bff {
        server mw-bff:7200;
        keepalive 16;
    }

    upstream mw_identity {
        server mw-identity:7100;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location = /_gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name admin.mattediworks.com;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location /api/ {
            proxy_http_version 1.1;
            proxy_pass http://mw_bff/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $mw_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $mw_forwarded_proto;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8080;
        server_name identity.mattediworks.com;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location / {
            proxy_http_version 1.1;
            proxy_pass http://mw_identity;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $mw_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $mw_forwarded_proto;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
