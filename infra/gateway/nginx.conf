worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    log_format main
        '$remote_addr - $host [$time_local] '
        '"$request_method $uri $server_protocol" '
        '$status $body_bytes_sent '
        'rt=$request_time';

    # Access logs deliberately use $uri from log_format, so query strings are excluded.
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    map $http_x_forwarded_proto $mw_forwarded_proto {
        default      $scheme;
        "~*^https$" https;
        "~*^http$"  http;
    }

    map $http_x_real_ip $mw_real_ip {
        default $http_x_real_ip;
        ""      $remote_addr;
    }

    map $http_x_request_id $mw_request_id {
        default                         $request_id;
        "~^[A-Za-z0-9._:-]{1,128}$"   $http_x_request_id;
    }

    limit_req_zone $mw_real_ip zone=mw_admin:10m rate=30r/s;
    limit_req_zone $mw_real_ip zone=mw_identity:10m rate=20r/s;
    limit_req_status 429;

    upstream mw_bff {
        server mw-bff:7200;
        keepalive 16;
    }

    upstream mw_identity {
        server mw-identity:7100;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location = /_gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name admin.mattediworks.com;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-Request-ID $mw_request_id always;

        location = /api/metrics {
            return 404;
        }

        location /api/ {
            limit_req zone=mw_admin burst=60 nodelay;
            proxy_http_version 1.1;
            proxy_pass http://mw_bff/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $mw_real_ip;
            proxy_set_header X-Forwarded-For $mw_real_ip;
            proxy_set_header X-Forwarded-Proto $mw_forwarded_proto;
            proxy_set_header X-Request-ID $mw_request_id;
            proxy_hide_header X-Request-ID;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8080;
        server_name identity.mattediworks.com;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-Request-ID $mw_request_id always;

        location = /metrics {
            return 404;
        }

        location / {
            limit_req zone=mw_identity burst=60 nodelay;
            proxy_http_version 1.1;
            proxy_pass http://mw_identity;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $mw_real_ip;
            proxy_set_header X-Forwarded-For $mw_real_ip;
            proxy_set_header X-Forwarded-Proto $mw_forwarded_proto;
            proxy_set_header X-Request-ID $mw_request_id;
            proxy_hide_header X-Request-ID;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
